<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>המגרש השכונתי</title>
<meta name="description" content="ארגון משחקי כדורגל שכונתיים: הרשמה, קבוצות מאוזנות, שעון, ציונים ושחקן המשחק.">
<meta name="theme-color" content="#1E6A3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="המגרש">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app — pitch-card hero for the next game, sections below, fixed bottom tab bar. Bibs (orange/blue/yellow/white) carry team identity. */
:root{
  --bg:#EDEFE8; --surface:#FFFFFF; --surface-2:#F5F6F1; --ink:#162018; --muted:#5B675D; --line:#D4D9CE;
  --pitch:#1E6A3A; --pitch-2:#185A31; --pitch-ink:#FFFFFF; --chalk:rgba(255,255,255,.55);
  --cone:#E0601A; --danger:#B42318; --ok:#1E6A3A;
  --bib-0:#E0601A; --bib-1:#2563A8; --bib-2:#C99A12; --bib-3:#7D8A80;
  --r1:#C2362B; --r2:#D27A1F; --r3:#22834A; --r4:#2463B0;
  --display:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#172019; --surface-2:#1C261E; --ink:#E6EDE5; --muted:#99A69B; --line:#2A362C;
  --pitch:#1D5A33; --pitch-2:#174A2A; --pitch-ink:#F2F7F1; --chalk:rgba(255,255,255,.4);
  --cone:#F0803C; --danger:#F06A5E; --ok:#5CC283;
  --bib-0:#F0803C; --bib-1:#5B9BE0; --bib-2:#E3B83A; --bib-3:#A3AFA6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#172019; --surface-2:#1C261E; --ink:#E6EDE5; --muted:#99A69B; --line:#2A362C;
  --pitch:#1D5A33; --pitch-2:#174A2A; --pitch-ink:#F2F7F1; --chalk:rgba(255,255,255,.4);
  --cone:#F0803C; --danger:#F06A5E; --ok:#5CC283;
  --bib-0:#F0803C; --bib-1:#5B9BE0; --bib-2:#E3B83A; --bib-3:#A3AFA6; color-scheme:dark}

[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.mode{font:inherit;cursor:pointer;font-size:.75rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
main{display:flex;flex-direction:column;gap:16px}
.label{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:700}

/* pitch hero */
.pitch{position:relative;overflow:hidden;background:var(--pitch);color:var(--pitch-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;
  background-image:repeating-linear-gradient(90deg,transparent 0 44px,rgba(255,255,255,.035) 44px 88px)}
.pitch::before{content:"";position:absolute;inset:10px;border:2px solid var(--chalk);border-radius:8px;pointer-events:none}
.pitch::after{content:"";position:absolute;width:120px;height:120px;border:2px solid var(--chalk);border-radius:50%;inset-inline-start:calc(50% - 60px);top:calc(50% - 60px);pointer-events:none;opacity:.6}
.pitch > *{position:relative;z-index:1}
.pitch .when{font-family:var(--display);font-size:1.6rem;font-weight:800;line-height:1.1}
.pitch .meta{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;opacity:.92}
.count{display:flex;align-items:baseline;gap:6px;font-family:var(--display)}
.count b{font-size:2.4rem;font-weight:800;line-height:1}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pitch-ink);border-radius:99px}

/* controls */
button,select,input{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.btn.primary:hover{background:var(--pitch-2)}
.btn.cone{background:var(--cone);border-color:var(--cone);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);background:transparent}
.btn.small{min-height:34px;padding:4px 12px;font-size:.875rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.pitch .btn{border-color:rgba(255,255,255,.4)}
.pitch .btn.in{background:var(--pitch-ink);color:var(--pitch);border-color:var(--pitch-ink)}
.pitch .btn.out{background:transparent;color:var(--pitch-ink)}
.pitch select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:var(--pitch-ink)}
.pitch select option{color:#162018;background:#fff}
:focus-visible{outline:3px solid var(--cone);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 140px}
.field span{font-size:.8rem;font-weight:700;color:var(--muted)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:start}
input,select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;box-sizing:border-box}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 14px;min-height:40px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* lists */
ol.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
ol.roster li{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:0}
ol.roster li .n{font-family:var(--display);font-weight:700;color:var(--muted);width:1.6em;flex:none;font-variant-numeric:tabular-nums}
ol.roster li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
ol.roster li.me{border-color:var(--pitch);box-shadow:inset 0 0 0 1px var(--pitch)}
ol.roster li.wait{opacity:.75;border-style:dashed}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 4px;border-radius:6px}
.x:hover{color:var(--danger)}
.lvl{display:inline-flex;gap:3px;direction:ltr}
.lvl i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvl i.on{background:var(--cone)}
.lvl.big button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:.8rem;color:var(--muted);padding:0}
.lvl.big button.on{background:var(--cone);border-color:var(--cone);color:#fff}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.team{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);min-width:0}
.team .hd{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;color:#fff;font-family:var(--display);font-weight:700}
.team ul{list-style:none;margin:0;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
.team li{display:flex;align-items:center;gap:6px;padding:3px 4px;min-width:0}
.team li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goalctl{display:inline-flex;align-items:center;gap:2px}
.goalctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;padding:0}
.goalctl b{min-width:1.4em;text-align:center;font-variant-numeric:tabular-nums}
.ball{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--ink);opacity:.8}
.bib{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}
.match{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;background:var(--surface-2);border-radius:10px;font-weight:700}
.match .sc{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums;unicode-bidi:isolate;direction:rtl}
.addmatch{display:grid;grid-template-columns:1fr 64px 64px 1fr;gap:6px;align-items:center}
.addmatch input{text-align:center}

/* table */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
td.nm,th.nm{text-align:start;width:100%}
tr.top1 td{font-weight:700}
.pos{font-family:var(--display);font-weight:700;color:var(--muted)}
.pts{font-family:var(--display);font-weight:800}

.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty svg{opacity:.8}
.hist{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}

/* tab bar */
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.8rem;color:var(--muted);cursor:pointer;min-height:56px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--pitch)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ok)}}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ok)}

.toast{position:fixed;inset-inline:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:6}
.toast span{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .box{background:var(--surface);border-radius:18px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
/* ratings + positions + in-game actions */
.rt{display:inline-flex;align-items:center;justify-content:center;min-width:2.7em;padding:1px 6px;border-radius:6px;font-family:var(--display);font-weight:700;font-size:.85rem;color:#fff;font-variant-numeric:tabular-nums;flex:none;direction:ltr}
.rt.r1{background:var(--r1)}.rt.r2{background:var(--r2)}.rt.r3{background:var(--r3)}.rt.r4{background:var(--r4)}
.rt.big{font-size:1.1rem;min-width:3em;padding:3px 8px;border-radius:8px}
.chip{font-size:.72rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);flex:none;line-height:1.6}
.trend{font-size:.75rem;font-weight:700;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.trend.up{color:var(--r3)}.trend.down{color:var(--r1)}
.pitch .trend{color:var(--pitch-ink)}
.pbtn{border:0;background:none;padding:0;text-align:start;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:6px;color:inherit;font:inherit}
.pbtn .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team li.open{background:var(--surface);border-radius:8px}
.team li.panel{display:block;padding:0}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.evbtn{display:flex;align-items:center;justify-content:space-between;gap:4px;border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 8px;font-size:.82rem;min-width:0;background:var(--surface-2)}
.evbtn span.l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evbtn.neg{border-style:dashed;border-color:var(--r1)}
.evbtn .w{font-size:.7rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.evsum{font-size:.75rem;color:var(--muted);white-space:nowrap}
input[type=range]{padding:0;min-height:32px;accent-color:var(--cone);background:transparent;border:0}
details.how summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
details.how table td,details.how table th{padding:5px 4px;font-size:.85rem}
/* timer */
.clock{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;text-align:center;font-variant-numeric:tabular-nums;direction:ltr;letter-spacing:.02em}
.clock.over{color:var(--cone)}
@media (prefers-reduced-motion: no-preference){.clock.over{animation:blink 1s steps(2) infinite}}
@keyframes blink{50%{opacity:.35}}
.tctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.pitch .btn.solid{background:var(--pitch-ink);color:var(--pitch);border-color:var(--pitch-ink)}
.pitch .btn.line{background:transparent;color:var(--pitch-ink)}
.pitch .seg{border-color:rgba(255,255,255,.35)}
.pitch .seg button{background:transparent;color:var(--pitch-ink);border-color:rgba(255,255,255,.35)}
.pitch .seg button[aria-pressed="true"]{background:var(--pitch-ink);color:var(--pitch)}
.pitch input{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:var(--pitch-ink)}
/* player card */
.namebtn{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.namebtn:hover{text-decoration-color:currentColor}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.75rem;color:var(--muted);font-weight:700}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;overflow:visible}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.chartbox .ref{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4}
.chartbox .axis{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chartbox .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.7}
.chartbox .ar{fill:var(--ink);opacity:.06}
.chartbox .pt{stroke:var(--surface);stroke-width:2}
.chartbox .hit{fill:transparent;cursor:pointer}
.chartbox .cross{stroke:var(--muted);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 10px;font-size:.8rem;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-12px;z-index:2;line-height:1.35}
.glist{display:flex;flex-direction:column}
.glist .gr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);min-width:0}
.glist .gr .d{flex:1;min-width:0}
.res{font-size:.72rem;font-weight:800;border-radius:5px;padding:0 5px;color:#fff}
.res.W{background:var(--r3)}.res.D{background:var(--muted)}.res.L{background:var(--r1)}
.ovr{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:3.2em;padding:2px 6px;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:800;font-size:1rem;line-height:1.05;font-variant-numeric:tabular-nums;flex:none}
.ovr small{font-size:.55rem;font-weight:700;letter-spacing:.04em;opacity:.8}
.ovr.big{font-size:1.6rem;min-width:3.4em;padding:4px 10px;border-radius:10px}
.pitch .ovr{background:var(--pitch-ink);color:var(--pitch)}
.attrs{display:flex;flex-direction:column;gap:4px}
.attr{display:grid;grid-template-columns:minmax(70px,1fr) 38px minmax(60px,2fr) 64px;align-items:center;gap:8px}
.attr .an{font-weight:700;font-size:.9rem}
.attr .aw{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.attr.dim .an{color:var(--muted);font-weight:600}
.abar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.abar i{display:block;height:100%;background:var(--cone);border-radius:99px}
.attr.dim .abar i{background:var(--muted);opacity:.5}
.attr input{min-height:36px;padding:2px 6px;text-align:center}
.prow{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;text-align:start;font:inherit;color:inherit}
.prow:hover .pmain b{text-decoration:underline}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column}
.pmain b,.pmain span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.votes{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(80px,1fr) 2fr 28px;gap:8px;align-items:center}
.vrow .vn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--muted);border-radius:99px}
.vrow.win .vbar i{background:var(--cone)}.vrow.win .vn{font-weight:800}
.mvp{font-size:.72rem;font-weight:800;color:var(--cone)}
.gsw{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.gsw button{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;cursor:pointer;font:inherit;color:var(--ink);min-height:44px}
.gsw button span{font-size:.8rem;color:var(--muted)}
.gsw button[aria-selected="true"]{background:var(--pitch);border-color:var(--pitch);color:var(--pitch-ink)}
.gsw button[aria-selected="true"] span{color:var(--pitch-ink);opacity:.85}
.gsw .add{justify-content:center;align-items:center;border-style:dashed;font-weight:700;color:var(--pitch)}
.pitch .btn.line{background:transparent;color:var(--pitch-ink)}
.note{font-size:.85rem;

background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .4s ease}.btn{transition:background .15s}}

/* standalone page base (the claude.ai viewer supplied these before) */
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<div id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M17 9l6 4.4-2.3 7h-7.4L11 13.4z" fill="currentColor"/><path d="M17 9V3M23 13.4l5.5-2M20.7 20.4l3.6 4.8M13.3 20.4l-3.6 4.8M11 13.4l-5.5-2" stroke="currentColor" stroke-width="2"/></svg>

<script>
(function(){
"use strict";
const BIBS=[{name:"כתומים",v:"--bib-0"},{name:"כחולים",v:"--bib-1"},{name:"צהובים",v:"--bib-2"},{name:"לבנים",v:"--bib-3"}];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>(Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const lsGet=k=>{try{return localStorage.getItem(k)}catch{return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}};
const isObj=o=>o&&typeof o==="object"&&!Array.isArray(o);
const merge=(a,b)=>{const o={...a};for(const k in b){o[k]=isObj(b[k])&&isObj(a[k])?merge(a[k],b[k]):b[k]}return o};

const S={players:[],games:[],signups:[],votes:[],ready:false,mode:"loading",stale:false,readOnly:false,
  tab:"game",me:lsGet("mg-me"),nTeams:2,sortBy:"pts",
  form:{date:"",time:"17:00",place:"",max:"12",pname:"",ppos:"MID",attrs:{pace:5,shoot:5,pass:5,drib:5,def:5,phys:5,gk:5},ma:"0",mb:"1",sa:"",sb:""}};

/* ---------- backends ---------- */
let B=null;
function localBackend(){
  let data={players:[],games:[],signups:[],votes:[]};
  try{const r=localStorage.getItem("mg-data");if(r)data=Object.assign(data,JSON.parse(r))}catch{}
  const save=()=>{try{localStorage.setItem("mg-data",JSON.stringify(data))}catch{}};
  const emit=()=>{S.players=data.players.slice();S.games=data.games.slice();S.signups=data.signups.slice();S.votes=data.votes.slice();S.ready=true;render()};
  const find=(c,id)=>data[c].findIndex(x=>x.id===id);
  return{start:emit,
    async put(c,id,o){const i=find(c,id),v={...o,id};i>=0?data[c][i]=v:data[c].push(v);save();emit()},
    async patch(c,id,o){const i=find(c,id);if(i<0)return;data[c][i]=merge(data[c][i],o);save();emit()},
    async del(c,id){data[c]=data[c].filter(x=>x.id!==id);save();emit()}};
}
function dbBackend(db){
  const q={};const chain=(k,fn)=>(q[k]=(q[k]||Promise.resolve()).then(fn,fn));
  const fail=e=>{if(e&&e.code==="invalid_argument"){S.readOnly=true;toast("אין לך הרשאה לעדכן כאן — אפשר רק לצפות")}
    else if(e&&e.code==="quota_exceeded")toast("המאגר מלא — מחק משחקים ישנים");else toast("השמירה נכשלה, נסה שוב");render();throw e};
  const strip=o=>{const c={...o};delete c.id;return c};
  return{
    start(){
      const seen={};const cols=["players","games","signups","votes"];
      const timer=setTimeout(()=>{S.ready=true;S.stale=true;S.connErr=S.connErr||"timeout — השרת לא ענה תוך 10 שניות";render()},10000);
      for(const c of cols){
        db.collection(c).onSnapshot(snap=>{
          S[c]=snap.docs.map(d=>({...d.data(),id:d.id}));seen[c]=true;
          if(cols.every(x=>seen[x])){S.ready=true;if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}}
          render();
        },err=>{clearTimeout(timer);S.ready=true;S.stale=true;S.connErr=(err&&(err.raw||err.code)||"error")+(err&&err.message?" — "+err.message:"");render()});
      }
    },
    put:(c,id,o)=>chain(c+id,()=>db.collection(c).doc(id).set(strip(o))).catch(fail),
    patch:(c,id,o)=>chain(c+id,()=>db.collection(c).doc(id).update(o)).catch(fail),
    del:(c,id)=>chain(c+id,()=>db.collection(c).doc(id).delete()).catch(fail)};
}

/* ---------- helpers ---------- */
const pl=id=>S.players.find(p=>p.id===id);
const pName=id=>pl(id)?.name||"שחקן שנמחק";
const openGames=()=>S.games.filter(g=>g.status==="open").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const openGame=()=>{const gs=openGames();return gs.find(g=>g.id===S.gameSel)||gs[0]};
const doneGames=()=>S.games.filter(g=>g.status==="done").sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
const signupsOf=g=>S.signups.filter(s=>s.gameId===g.id&&pl(s.playerId)).sort((a,b)=>(a.at||0)-(b.at||0));
function fmtDate(d,t){if(!d)return"";const dt=new Date(d+"T"+(t||"12:00"));
  const wd=new Intl.DateTimeFormat("he-IL",{weekday:"long"}).format(dt);
  const dm=new Intl.DateTimeFormat("he-IL",{day:"numeric",month:"numeric"}).format(dt);return wd+" "+dm}
function nextFriday(){const d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7||7));
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
const isoDay=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
S.form.date=isoDay(new Date());
/* ---------- positions, actions, ratings ---------- */
const POS=[{k:"GK",n:"שוער"},{k:"DEF",n:"הגנה"},{k:"MID",n:"קישור"},{k:"FWD",n:"התקפה"}];
const posName=k=>(POS.find(p=>p.k===k)||POS[2]).n;
/* Match rating: weights per action, by position. Everyone starts a game at 6.0. */
const EV=[
  {k:"goal",n:"שער",w:{GK:1.2,DEF:1.1,MID:1.0,FWD:0.9}},
  {k:"assist",n:"בישול",w:{GK:.8,DEF:.8,MID:.8,FWD:.7}},
  {k:"keyPass",n:"מסירת מפתח",w:{GK:.3,DEF:.3,MID:.35,FWD:.25}},
  {k:"shotOn",n:"בעיטה למסגרת",w:{GK:.15,DEF:.2,MID:.15,FWD:.1}},
  {k:"dribble",n:"דריבל מוצלח",w:{GK:.15,DEF:.2,MID:.15,FWD:.15}},
  {k:"tackle",n:"חטיפה / תיקול",w:{GK:.2,DEF:.25,MID:.2,FWD:.15}},
  {k:"block",n:"הרחקה / חסימה",w:{GK:.15,DEF:.25,MID:.15,FWD:.1}},
  {k:"save",n:"הצלה",w:{GK:.35,DEF:.3,MID:.3,FWD:.3}},
  {k:"missBig",n:"החמצה ודאית",w:{GK:-.4,DEF:-.4,MID:-.4,FWD:-.4},neg:1},
  {k:"error",n:"טעות שהובילה לשער",w:{GK:-1,DEF:-1,MID:-1,FWD:-1},neg:1},
  {k:"ownGoal",n:"שער עצמי",w:{GK:-1,DEF:-1,MID:-1,FWD:-1},neg:1}];
const START=6.0,MVP_BONUS=0.3,FORM_BASE=6.5,FORM_N=5;
/* Overall rating: skills the user enters (1–10), weighted by position. */
const ATTR=[{k:"pace",n:"מהירות"},{k:"shoot",n:"בעיטה"},{k:"pass",n:"מסירה"},{k:"drib",n:"כדרור"},{k:"def",n:"הגנה"},{k:"phys",n:"כוח וכושר"},{k:"gk",n:"שוערות"}];
const AW={GK:{gk:.7,pass:.1,phys:.1,def:.05,pace:.05},
  DEF:{def:.4,phys:.2,pace:.15,pass:.15,drib:.05,shoot:.05},
  MID:{pass:.35,drib:.2,def:.15,shoot:.1,phys:.1,pace:.1},
  FWD:{shoot:.35,drib:.2,pace:.2,pass:.1,phys:.1,def:.05}};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const r1=x=>Math.round(x*10)/10;
const teamsArr=g=>(g.teams||[]).map(t=>t.players||[]);
function evOf(g,pid){const e={...((g.ev||{})[pid]||{})};if(e.goal==null&&(g.goals||{})[pid])e.goal=g.goals[pid];return e}
const legacyBase=p=>p.rating!=null?+p.rating:p.level!=null?p.level*2:5;
const attrsOf=p=>{const d=p.attrs?5:legacyBase(p);const o={};for(const a of ATTR)o[a.k]=+(p.attrs?.[a.k]??d);return o};
const abilityFrom=(attrs,pos)=>{const w=AW[pos]||AW.MID;let s=0;for(const k in w)s+=w[k]*(+attrs[k]||0);return r1(clamp(s,1,10))};
const ability=p=>abilityFrom(attrsOf(p),p.pos||"MID");
function rawMatchRating(g,pid){
  const pos=pl(pid)?.pos||"MID",e=evOf(g,pid);let r=START;
  for(const x of EV)r+=(x.w[pos]||0)*(e[x.k]||0);
  const ti=teamsArr(g).findIndex(t=>t.includes(pid));let res=0;
  if(ti>=0)for(const m of g.matches||[]){let my,op;if(m.a===ti){my=m.sa;op=m.sb}else if(m.b===ti){my=m.sb;op=m.sa}else continue;
    res+=my>op?.2:my<op?-.2:0;
    if(op===0)res+=pos==="GK"?.4:pos==="DEF"?.25:0;
    if(pos==="GK")res-=.1*Math.max(0,op-1);else if(pos==="DEF")res-=.05*Math.max(0,op-1)}
  return r+clamp(res,-1,1);
}
/* man of the match = most votes (at least 2), tie broken by match rating */
function votesFor(g){const ids=new Set(teamsArr(g).flat());const t={};
  for(const v of S.votes)if(v.gameId===g.id&&ids.has(v.target)&&pl(v.target)&&pl(v.voter)&&v.voter!==v.target)t[v.target]=(t[v.target]||0)+1;return t}
function mvpOf(g){const t=votesFor(g);const c=Object.entries(t).filter(([,n])=>n>=2);if(!c.length)return null;
  c.sort((a,b)=>b[1]-a[1]||rawMatchRating(g,b[0])-rawMatchRating(g,a[0]));return c[0][0]}
function matchRating(g,pid){return r1(clamp(rawMatchRating(g,pid)+(mvpOf(g)===pid?MVP_BONUS:0),3,10))}
/* overall = ability from skills + form from the last 5 match ratings (±1 at most) */
const formOf=h=>{const l=h.slice(-FORM_N);if(!l.length)return 0;return r1(clamp((l.reduce((a,b)=>a+b,0)/l.length-FORM_BASE)*.5,-1,1))};
function ratingInfo(){
  const m=new Map(S.players.map(p=>[p.id,{ability:ability(p),hist:[]}]));
  for(const g of doneGames().slice().reverse())for(const id of new Set(teamsArr(g).flat())){const x=m.get(id);if(x)x.hist.push(matchRating(g,id))}
  for(const x of m.values()){x.form=formOf(x.hist);x.cur=r1(clamp(x.ability+x.form,1,10));
    x.prev=x.hist.length?r1(clamp(x.ability+formOf(x.hist.slice(0,-1)),1,10)):null;
    x.avg=x.hist.length?r1(x.hist.reduce((a,b)=>a+b,0)/x.hist.length):null}
  return m;
}
let RI=new Map();const R=id=>RI.get(id)?.cur??5;
const badge=(r,big)=>`<span class="rt ${r>=8?"r4":r>=7?"r3":r>=6?"r2":"r1"}${big?" big":""}">${(+r).toFixed(1)}</span>`;
const ovr=(r,big)=>`<span class="ovr${big?" big":""}"><small>רייטינג</small>${(+r).toFixed(1)}</span>`;
const sgn=x=>(x>0?"+":x<0?"−":"±")+Math.abs(x).toFixed(1);
const trend=x=>{if(x.prev==null)return"";const d=r1(x.cur-x.prev);return d>0?`<span class="trend up">▲${d.toFixed(1)}</span>`:d<0?`<span class="trend down">▼${Math.abs(d).toFixed(1)}</span>`:""};
let toastT;function toast(msg){const t=document.getElementById("toast");t.firstElementChild.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}
let sheetFn=null;function ask(text,fn){document.getElementById("sheetYes").textContent="כן, בצע";document.getElementById("sheetText").textContent=text;sheetFn=fn;document.getElementById("sheet").hidden=false;document.getElementById("sheetYes").focus()}
document.getElementById("sheetNo").onclick=()=>{document.getElementById("sheet").hidden=true;sheetFn=null};
document.getElementById("sheetYes").onclick=()=>{document.getElementById("sheet").hidden=true;const f=sheetFn;sheetFn=null;f&&f()};

/* balanced split: shuffle, sort by level, snake draft, then improve with swaps */
function split(ids,k){
  RI=ratingInfo();
  const arr=ids.map(id=>({id,r:R(id)+Math.random()*0.8})).sort((a,b)=>b.r-a.r);
  const teams=Array.from({length:k},()=>[]);
  arr.forEach((p,i)=>{const round=Math.floor(i/k),pos=i%k;teams[round%2?k-1-pos:pos].push(p.id)});
  const sum=t=>t.reduce((s,id)=>s+R(id),0);
  /* cost = gap in total rating + gap in how many of each position (so keepers/defenders spread out) */
  const spreadOf=()=>{const s=teams.map(sum);let c=Math.max(...s)-Math.min(...s);
    for(const P of POS){const n=teams.map(t=>t.filter(id=>(pl(id)?.pos||"MID")===P.k).length);c+=(P.k==="GK"?2:.8)*(Math.max(...n)-Math.min(...n))}return c};
  for(let it=0;it<400;it++){
    const a=Math.floor(Math.random()*k),b=Math.floor(Math.random()*k);if(a===b||!teams[a].length||!teams[b].length)continue;
    const i=Math.floor(Math.random()*teams[a].length),j=Math.floor(Math.random()*teams[b].length);
    const before=spreadOf();[teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];
    if(spreadOf()>before)[teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];
  }
  return teams.map(players=>({players}));
}

function stats(){
  const m=new Map(S.players.map(p=>[p.id,{p,gp:0,w:0,d:0,l:0,g:0,a:0}]));
  for(const g of doneGames()){
    const T=(g.teams||[]).map(t=>t.players||[]);
    new Set(T.flat()).forEach(id=>{const s=m.get(id);if(s)s.gp++});
    for(const mt of g.matches||[]){
      const r=Math.sign(mt.sa-mt.sb);
      (T[mt.a]||[]).forEach(id=>{const s=m.get(id);if(s)r>0?s.w++:r<0?s.l++:s.d++});
      (T[mt.b]||[]).forEach(id=>{const s=m.get(id);if(s)r<0?s.w++:r>0?s.l++:s.d++});
    }
    new Set(T.flat()).forEach(id=>{const s=m.get(id);if(!s)return;const e=evOf(g,id);s.g+=e.goal||0;s.a+=e.assist||0});
  }
  return[...m.values()].map(s=>{const x=RI.get(s.p.id)||{};return{...s,pts:s.w*3+s.d,cur:x.cur??6.5,avg:x.avg,ri:x}});
}

/* ---------- timer (shared through the game doc: dur seconds, start ms or null, acc ms already run) ---------- */
const PRESETS=[5,7,10,12,15];
const tOf=g=>({dur:600,start:null,acc:0,...(g.timer||{})});
const remainMs=t=>t.dur*1000-(t.acc+(t.start?Date.now()-t.start:0));
const fmtClock=ms=>{const neg=ms<0,s=Math.ceil(Math.abs(ms)/1000);return (neg?"+":"")+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function timerHtml(g){
  const t=tOf(g),rem=remainMs(t),run=!!t.start,mins=t.dur/60;
  const pct=clamp(1-rem/(t.dur*1000),0,1)*100;
  return `<section class="pitch" id="timer-card" aria-label="שעון משחקון">
    <div class="spread"><div class="label" style="color:inherit;opacity:.85">שעון משחקון</div><span class="small" style="font-weight:700" id="clock-st">${run?"רץ":rem<=0?"נגמר הזמן":t.acc?"בהשהיה":"מוכן"}</span></div>
    <div class="clock ${rem<=0?"over":""}" id="clock" role="timer" aria-live="off">${rem<=0&&!run?"00:00":fmtClock(rem)}</div>
    <div class="bar"><i id="clock-bar" style="width:${pct}%"></i></div>
    ${S.readOnly?"":`<div class="tctl">
      ${run?`<button class="btn solid" data-act="tPause">השהה</button>`:`<button class="btn solid" data-act="tStart">${t.acc&&rem>0?"המשך":"התחל"}</button>`}
      <button class="btn line" data-act="tAdd">+1 דקה</button>
      <button class="btn line" data-act="tReset">אפס</button>
    </div>
    <div class="spread"><span class="small" style="font-weight:700">משך משחקון</span>
      <div class="row"><div class="seg" role="group" aria-label="משך בדקות">${PRESETS.map(m=>`<button data-act="tDur" data-m="${m}" aria-pressed="${mins===m}">${m}</button>`).join("")}</div>
      <input id="t-custom" type="number" min="1" max="90" step="0.5" value="${PRESETS.includes(mins)?"":mins}" placeholder="אחר" data-act="tCustom" class="num" style="width:72px;min-height:40px;padding:4px 8px" aria-label="משך אחר בדקות"></div></div>`}
  </section>`;
}
let audioCtx=null,wakeLock=null,alarmed=null;
function primeAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch{}}
function whistle(){if(!audioCtx)return;try{const now=audioCtx.currentTime;[0,.35,.7].forEach((d,i)=>{const o=audioCtx.createOscillator(),gn=audioCtx.createGain();
  o.type="square";o.frequency.setValueAtTime(2300,now+d);o.frequency.linearRampToValueAtTime(2050,now+d+(i===2?.6:.25));
  gn.gain.setValueAtTime(.0001,now+d);gn.gain.exponentialRampToValueAtTime(.15,now+d+.02);gn.gain.exponentialRampToValueAtTime(.0001,now+d+(i===2?.65:.3));
  o.connect(gn).connect(audioCtx.destination);o.start(now+d);o.stop(now+d+.7)})}catch{}}
async function keepAwake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener?.("release",()=>wakeLock=null)}
  else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch{wakeLock=null}}
setInterval(()=>{const g=S.tab==="game"&&!S.card&&openGame();const el=document.getElementById("clock");if(!g||!el)return;
  const t=tOf(g),rem=remainMs(t);if(!t.start)return;
  el.textContent=fmtClock(rem);el.classList.toggle("over",rem<=0);
  const bar=document.getElementById("clock-bar");if(bar)bar.style.width=clamp(1-rem/(t.dur*1000),0,1)*100+"%";
  const st=document.getElementById("clock-st");if(st)st.textContent=rem<=0?"נגמר הזמן — הארכה":"רץ";
  const key=g.id+":"+t.start+":"+t.dur;
  if(rem<=0&&alarmed!==key){alarmed=key;whistle();try{navigator.vibrate&&navigator.vibrate([300,150,300,150,600])}catch{}toast("שריקת סיום! רשום את התוצאה")}
},250);

/* ---------- player card ---------- */
const pl2=(n,one,many)=>n===1?one:`${n} ${many}`;
const wdl=r=>[r.w?pl2(r.w,"ניצחון","ניצחונות"):"",r.d?pl2(r.d,"תיקו","תיקו"):"",r.l?pl2(r.l,"הפסד","הפסדים"):""].filter(Boolean).join(", ");
function playerGames(id){
  return doneGames().slice().reverse().filter(g=>teamsArr(g).some(t=>t.includes(id))).map(g=>{
    const ti=teamsArr(g).findIndex(t=>t.includes(id));let w=0,d=0,l=0;
    for(const m of g.matches||[]){let my,op;if(m.a===ti){my=m.sa;op=m.sb}else if(m.b===ti){my=m.sb;op=m.sa}else continue;my>op?w++:my<op?l++:d++}
    return{g,mr:matchRating(g,id),e:evOf(g,id),w,d,l}});
}
function viewCard(id){
  const p=pl(id),x=RI.get(id)||{},st=stats().find(s=>s.p.id===id)||{gp:0,w:0,d:0,l:0,g:0,a:0},gs=playerGames(id);
  const played=st.w+st.d+st.l,best=gs.length?Math.max(...gs.map(r=>r.mr)):null;

function drawChart(){
  const box=document.getElementById("chart");if(!box||!S.card)return;
  const gs=playerGames(S.card);if(!gs.length)return;
  const W=Math.max(260,box.clientWidth),H=220,m={t:14,r:12,b:28,l:30},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const n=gs.length,X=i=>m.l+(n===1?iw/2:i*iw/(n-1)),Y=v=>m.t+(10-v)/7*ih;
  const col=v=>v>=8?"var(--r4)":v>=7?"var(--r3)":v>=6?"var(--r2)":"var(--r1)";
  const pts=gs.map((r,i)=>[X(i),Y(r.mr)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const area=n>1?path+`L${pts[n-1][0]} ${Y(3)}L${pts[0][0]} ${Y(3)}Z`:"";
  const lblIdx=n<=2?[...Array(n).keys()]:[0,Math.floor((n-1)/2),n-1];
  const dShort=g=>new Intl.DateTimeFormat("he-IL",{day:"numeric",month:"numeric"}).format(new Date(g.date+"T12:00"));
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" direction="ltr" role="img" aria-label="ציוני משחקים, מ-${gs[0].mr} עד ${gs[n-1].mr}">
    ${[4,6,8,10].map(v=>`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join("")}
    <line class="ref" x1="${m.l}" x2="${W-m.r}" y1="${Y(6)}" y2="${Y(6)}"/>
    ${area?`<path class="ar" d="${area}"/>`:""}<path class="ln" d="${path}"/>
    <line class="cross" id="cross" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" visibility="hidden"/>
    ${pts.map((p,i)=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="${i===n-1?6:5}" fill="${col(gs[i].mr)}"/>`).join("")}
    ${lblIdx.map(i=>`<text class="axis" x="${X(i)}" y="${H-8}" text-anchor="${n>1&&i===0?"start":n>1&&i===n-1?"end":"middle"}">${dShort(gs[i].g)}</text>`).join("")}
    ${pts.map((p,i)=>`<rect class="hit" data-i="${i}" x="${n===1?m.l:p[0]-iw/(2*(n-1))}" y="${m.t}" width="${n===1?iw:iw/(n-1)}" height="${ih}"/>`).join("")}
  </svg><div class="tip" id="tip" hidden></div>`;
  const tip=box.querySelector("#tip"),cross=box.querySelector("#cross");
  const show=i=>{const r=gs[i],p=pts[i];cross.setAttribute("x1",p[0]);cross.setAttribute("x2",p[0]);cross.setAttribute("visibility","visible");
    tip.innerHTML=`<b>${(+r.mr).toFixed(1)}</b> · ${esc(fmtDate(r.g.date,r.g.time))}<br>${[r.e.goal?pl2(r.e.goal,"שער אחד","שערים"):"",r.e.assist?pl2(r.e.assist,"בישול","בישולים"):"",wdl(r)].filter(Boolean).join(" · ")}`;
    tip.hidden=false;tip.style.left=clamp(p[0],70,W-70)+"px";tip.style.top=p[1]+"px"};
  const hide=()=>{tip.hidden=true;cross.setAttribute("visibility","hidden")};
  box.querySelectorAll(".hit").forEach(h=>{h.addEventListener("pointerenter",()=>show(+h.dataset.i));h.addEventListener("click",()=>show(+h.dataset.i))});
  box.querySelector("svg").addEventListener("pointerleave",hide);
}

    return `<label class="attr ${wt?"":"dim"}"><span class="an">${a.n}</span><span class="aw">${wt?Math.round(wt*100)+"%":"—"}</span>
    <span class="abar"><i style="width:${v*10}%"></i></span>
    <input type="number" min="1" max="10" step="0.5" value="${v}" class="num" ${prefix==="f"?`id="f-a-${a.k}" data-attr="${a.k}"`:`id="c-a-${a.k}" data-act="setAttr" data-id="${esc(id)}" data-k="${a.k}"`} aria-label="${a.n}" ${S.readOnly&&prefix!=="f"?"disabled":""}></label>`}).join("")}</div>`;
}

function voteCard(g,title){
  const ids=[...new Set(teamsArr(g).flat())].filter(pl);if(!ids.length)return"";
  const t=votesFor(g),total=Object.values(t).reduce((a,b)=>a+b,0),mvp=mvpOf(g);
  const myVote=S.me&&S.votes.find(v=>v.gameId===g.id&&v.voter===S.me);
  const canVote=S.me&&ids.includes(S.me)&&!S.readOnly;
  const rows=ids.map(id=>[id,t[id]||0]).filter(([,n])=>n).sort((a,b)=>b[1]-a[1]);
  return `<section class="card"><div class="spread"><h2>${title}</h2><span class="muted small num">${pl2(total,"קול אחד","קולות")}</span></div>
    ${canVote?`<div class="row"><select id="vote-sel" style="flex:1 1 160px;width:auto" aria-label="בחר שחקן"><option value="">בחר את שחקן המשחק…</option>${ids.filter(id=>id!==S.me).sort((a,b)=>pName(a).localeCompare(pName(b),"he")).map(id=>`<option value="${esc(id)}" ${myVote?.target===id?"selected":""}>${esc(pName(id))}</option>`).join("")}</select>
      <button class="btn primary small" data-act="vote" data-g="${esc(g.id)}">${myVote?"שנה הצבעה":"הצבע"}</button></div>
      ${myVote?`<span class="muted small">הצבעת ל${esc(pName(myVote.target))}.</span>`:""}`
    :`<p class="muted small" style="margin:0">${S.me&&pl(S.me)?"רק מי ששיחק במשחק יכול להצביע.":"כדי להצביע, בחר את השם שלך בכרטיס המשחק."}</p>`}
    ${rows.length?`<div class="votes">${rows.map(([id,n])=>`<div class="vrow ${id===mvp?"win":""}"><span class="vn">${id===mvp?"★ ":""}${esc(pName(id))}</span><span class="vbar"><i style="width:${n/rows[0][1]*100}%"></i></span><b class="num">${n}</b></div>`).join("")}</div>`:""}
    <span class="muted small">הזוכה (לפחות 2 קולות) מקבל ${sgn(MVP_BONUS)} לציון המשחק. אי אפשר להצביע לעצמך.</span>
  </section>`;
}

function viewTable(){
  const all=stats();
  const rows=all.filter(s=>s.gp>0).sort((a,b)=>S.sortBy==="goals"?(b.g-a.g||b.a-a.a||b.pts-a.pts):S.sortBy==="rt"?(b.cur-a.cur||b.pts-a.pts):S.sortBy==="mr"?((b.avg??0)-(a.avg??0)||b.pts-a.pts):(b.pts-a.pts||b.g-a.g||b.w-a.w));
  if(!rows.length)return `<section class="card"><div class="empty">${ICON.table.replace("<svg",'<svg width="44" height="44"')}<h2>הטבלה ריקה</h2><p class="muted" style="margin:0">אחרי שתסיימו משחק ותרשמו תוצאות, כאן תופיע טבלת הניקוד, מלך השערים והשחקן עם הציון הגבוה.</p></div></section>`;
  const king=all.filter(s=>s.g>0).sort((a,b)=>b.g-a.g)[0];
  const best=rows.slice().sort((a,b)=>b.cur-a.cur)[0];
  return `<section class="pitch"><div class="spread" style="align-items:flex-start">
    <div class="stack" style="gap:4px"><div class="label" style="color:inherit;opacity:.85">הרייטינג הגבוה בשכונה</div><div class="when">${esc(best.p.name)}</div><div class="small">${posName(best.p.pos)}</div></div>${ovr(best.cur,true)}</div>
    ${king?`<div class="spread"><span class="small" style="font-weight:700">מלך השערים: ${esc(king.p.name)}</span><span class="count"><b class="num" style="font-size:1.6rem">${king.g}</b><span>שערים</span></span></div>`:""}</section>
  <section class="card"><div class="spread"><h2>טבלת השכונה</h2>
    <div class="seg" role="group" aria-label="מיון"><button data-act="sort" data-s="pts" aria-pressed="${S.sortBy==="pts"}">נקודות</button><button data-act="sort" data-s="rt" aria-pressed="${S.sortBy==="rt"}">רייטינג</button><button data-act="sort" data-s="mr" aria-pressed="${S.sortBy==="mr"}">ציון משחק</button><button data-act="sort" data-s="goals" aria-pressed="${S.sortBy==="goals"}">שערים</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th class="nm">שחקן</th><th title="רייטינג כולל">רייט׳</th><th title="ממוצע ציון משחק">ממוצע</th><th title="משחקים">מש׳</th><th title="ניצחונות">נ׳</th><th title="תיקו">ת׳</th><th title="הפסדים">ה׳</th><th title="שערים">⚽</th><th title="בישולים">בש׳</th><th title="נקודות">נק׳</th></tr></thead>
    <tbody>${rows.map((s,i)=>`<tr class="${i===0?"top1":""}"><td class="pos">${i+1}</td><td class="nm"><button class="namebtn" data-act="card" data-id="${esc(s.p.id)}">${esc(s.p.name)}</button> <span class="chip">${posName(s.p.pos)}</span></td><td><b class="num">${s.cur.toFixed(1)}</b></td><td>${s.avg!=null?badge(s.avg):"—"}</td><td>${s.gp}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.g}</td><td>${s.a}</td><td class="pts">${s.pts}</td></tr>`).join("")}</tbody></table></div>
    <p class="muted small" style="margin:0">ניצחון 3 נקודות, תיקו נקודה. כל משחקון "מנצח נשאר" נספר בנפרד. רייטינג = יכולת לפי עמדה + כושר. ממוצע = ממוצע ציוני המשחק. ההסבר המלא בלשונית "שחקנים".</p>
  </section>`;
}

function viewHistory(){
  const gs=doneGames();
  if(!gs.length)return `<section class="card"><div class="empty">${ICON.history.replace("<svg",'<svg width="44" height="44"')}<h2>עוד אין היסטוריה</h2><p class="muted" style="margin:0">משחקים שהסתיימו יופיעו כאן עם התוצאות והכובשים.</p></div></section>`;
  return `<section class="card"><h2>משחקים קודמים</h2>${gs.map(g=>{
    const sc=[...new Set(teamsArr(g).flat())].filter(pl).map(id=>[id,evOf(g,id).goal||0]).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
    return `<div class="hist"><div class="spread"><b>${esc(fmtDate(g.date,g.time))}</b><span class="muted small">${esc(g.place||"")}</span></div>
    ${(g.matches||[]).map(m=>`<div class="match"><span class="bib" style="background:var(${BIBS[m.a].v})"></span>${BIBS[m.a].name}<span class="sc">${m.sa} – ${m.sb}</span>${BIBS[m.b].name}<span class="bib" style="background:var(${BIBS[m.b].v})"></span></div>`).join("")||`<span class="muted small">לא נרשמו תוצאות</span>`}
    ${(()=>{const ids=[...new Set(teamsArr(g).flat())].filter(pl);if(!ids.length)return"";const mv=mvpOf(g),top=ids.map(id=>[id,matchRating(g,id)]).sort((a,b)=>b[1]-a[1])[0];return (mv?`<div class="row small"><span class="mvp">★ שחקן המשחק (הצבעה):</span><b>${esc(pName(mv))}</b>${badge(matchRating(g,mv))}</div>`:"")+`<div class="row small"><span class="muted">הציון הגבוה:</span><b>${esc(pName(top[0]))}</b>${badge(top[1])}</div>`})()}
    ${sc.length?`<div class="small"><span class="muted">כובשים: </span>${sc.map(([id,n])=>`${esc(pName(id))} ${n>1?`(${n})`:""}`).join(" · ")}</div>`:""}
    ${S.readOnly?"":`<div><button class="btn danger small" data-act="delGame" data-id="${esc(g.id)}">מחק משחק</button></div>`}</div>`}).join("")}</section>`;
}

function render(){
  const a=document.activeElement,fid=a&&a.id,sel=a&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;
  document.getElementById("mode").textContent=S.mode==="db"?(S.stale?"לא מחובר — לחץ לפרטים":S.readOnly?"צפייה בלבד":"משותף לכל השכונה"):S.mode==="local"?"נשמר במכשיר הזה":"טוען…";
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${ICON[k]}<span>${l}</span></button>`).join("");
  if(!S.ready)return;
  const v=document.getElementById("view");
  RI=ratingInfo();
  if(S.card&&!pl(S.card))S.card=null;
  v.innerHTML=S.card?viewCard(S.card):S.tab==="game"?viewGame():S.tab==="players"?viewPlayers():S.tab==="table"?viewTable():viewHistory();
  if(fid){const el=document.getElementById(fid);if(el&&el!==a){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch{}}}

async function setDur(min){const g=openGame(),t=tOf(g);if(t.start){toast("עצור את השעון לפני שמשנים משך");return}
  await B.patch("games",g.id,{timer:{dur:Math.round(min*60),start:null,acc:0}})}
const ACT={

  pickGame(el){S.gameSel=el.dataset.id;S.editGame=false;S.openP=null;render()},

  setMe(el){S.me=el.value||null;lsSet("mg-me",S.me);render()},

  async addOther(){const g=openGame(),el=document.getElementById("add-other");if(!g||!el.value)return;

  async unsign(el){await B.del("signups",el.dataset.id)},
  async copyList(){const g=openGame();const su=signupsOf(g),max=+g.max||12;

  ppos(el){S.form.ppos=el.dataset.k;render()},
  async setPos(el){await B.patch("players",el.dataset.id,{pos:el.value})},
  async setAttr(el){const p=pl(el.dataset.id);const v=r1(clamp(Math.round((parseFloat(el.value)||5)*2)/2,1,10));el.value=v;
    const full=attrsOf(p);full[el.dataset.k]=v;await B.patch("players",p.id,{attrs:full})},
  async vote(el){const sel=document.getElementById("vote-sel");if(!sel||!sel.value){toast("בחר שחקן");return}
    const gid=el.dataset.g;await B.put("votes",gid+"_"+S.me,{gameId:gid,voter:S.me,target:sel.value,at:Date.now()});toast("ההצבעה נקלטה")},
  async addPlayer(){const name=S.form.pname.trim();if(!name){toast("כתוב שם");document.getElementById("f-pname")?.focus();return}
    if(S.players.some(p=>p.name.trim()===name)){toast("כבר יש שחקן בשם הזה");return}
    const id=uid();await B.put("players",id,{name,pos:S.form.ppos,attrs:{...S.form.attrs},createdAt:Date.now()});S.form.attrs={pace:5,shoot:5,pass:5,drib:5,def:5,phys:5,gk:5};S.form.pname="";
    if(!S.me){S.me=id;lsSet("mg-me",id)}toast(`${name} נוסף`)},
  delPlayer(el){const p=pl(el.dataset.id);ask(`למחוק את ${p.name}? הסטטיסטיקה שלו תימחק מהטבלה.`,async()=>{for(const s of S.signups.filter(s=>s.playerId===p.id))await B.del("signups",s.id);await B.del("players",p.id);if(S.me===p.id){S.me=null;lsSet("mg-me",null)}S.card=null;render()})},
  sort(el){S.sortBy=el.dataset.s;render()},
  card(el){S.card=el.dataset.id;render();window.scrollTo(0,0)},
  closeCard(){S.card=null;render()},
  async tStart(){primeAudio();keepAwake(true);const g=openGame(),t=tOf(g);const acc=remainMs(t)<=0?0:t.acc;
    await B.patch("games",g.id,{timer:{dur:t.dur,acc,start:Date.now()}})},
  async tPause(){keepAwake(false);const g=openGame(),t=tOf(g);await B.patch("games",g.id,{timer:{dur:t.dur,start:null,acc:t.acc+(t.start?Date.now()-t.start:0)}})},
  async tReset(){keepAwake(false);const g=openGame(),t=tOf(g);await B.patch("games",g.id,{timer:{dur:t.dur,start:null,acc:0}})},
  async tAdd(){const g=openGame(),t=tOf(g);let acc=t.acc,start=t.start;
    if(remainMs(t)<=0){acc=Math.max(0,t.dur-60)*1000;start=start?Date.now():null;await B.patch("games",g.id,{timer:{dur:t.dur,acc,start}});return}
    await B.patch("games",g.id,{timer:{dur:t.dur+60,acc,start}})},
  async tDur(el){await setDur(+el.dataset.m)},
  async tCustom(el){const v=parseFloat(el.value);if(v>0)await setDur(clamp(v,1,90))}
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;S.card=null;render();window.scrollTo(0,0);return}
  const b=e.target.closest("button[data-act]");if(b&&ACT[b.dataset.act]&&!b.disabled){Promise.resolve(ACT[b.dataset.act](b)).catch(()=>{})}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.matches("select[data-act],input[data-act]"))Promise.resolve(ACT[el.dataset.act](el)).catch(()=>{});
  else if(el.dataset.f)S.form[el.dataset.f]=el.value});
document.addEventListener("input",e=>{const el=e.target;
  if(el.dataset&&el.dataset.attr){const v=parseFloat(el.value);if(v>=1&&v<=10){S.form.attrs[el.dataset.attr]=v;const p=document.getElementById("prv");if(p)p.innerHTML=ovr(abilityFrom(S.form.attrs,S.form.ppos),true);const b=el.parentElement.querySelector(".abar i");if(b)b.style.width=v*10+"%"}return}
  if(el.dataset&&el.dataset.f){S.form[el.dataset.f]=el.value;
  if(el.id==="f-prating"){const p=document.getElementById("prv");if(p)p.innerHTML=badge(+el.value,true)}}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="f-pname"){ACT.addPlayer()}
  if(e.key==="Escape"&&!document.getElementById("sheet").hidden)document.getElementById("sheetNo").click()});

document.getElementById("mode").addEventListener("click",()=>{if(S.mode!=="db"||!S.stale)return;
  ask("אין חיבור לשרת.\n\nפרטים: "+(S.connErr||"לא ידוע")+(window.FB_AUTH_ERR?"\nכניסה: "+window.FB_AUTH_ERR:"")+"\n\nלנסות שוב?",()=>location.reload())});

/* ---------- Firebase: same call shape as the page store (collection().onSnapshot / doc().set|update|delete) ---------- */
const FB="https://www.gstatic.com/firebasejs/10.12.2/";
async function connectFirebase(){
  const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.projectId||/YOUR_/.test(cfg.apiKey||""))return null;
  const [A,F,Au]=await Promise.all([import(FB+"firebase-app.js"),import(FB+"firebase-firestore.js"),import(FB+"firebase-auth.js")]);
  const app=A.initializeApp(cfg);
  try{await Au.signInAnonymously(Au.getAuth(app))}catch(e){window.FB_AUTH_ERR=(e&&e.code||"")+" "+(e&&e.message||"");console.warn("anonymous sign-in failed",e)}
  const fdb=F.getFirestore(app);
  const code=e=>({code:e&&e.code==="permission-denied"?"invalid_argument":e&&e.code==="resource-exhausted"?"quota_exceeded":"unavailable",raw:e&&e.code,message:String(e&&e.message||"")});
  const flat=(o,p="",out={})=>{for(const k in o){const v=o[k],key=p?p+"."+k:k;
    if(v&&typeof v==="object"&&!Array.isArray(v)&&Object.keys(v).length)flat(v,key,out);else out[key]=v}return out};
  return{collection:c=>({
    onSnapshot:(next,err)=>F.onSnapshot(F.collection(fdb,c),{includeMetadataChanges:true},
      s=>next({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:s.metadata.fromCache}}),e=>err&&err(code(e))),
    doc:id=>{const r=F.doc(fdb,c,id);return{
      set:o=>F.setDoc(r,o).catch(e=>{throw code(e)}),
      update:o=>F.updateDoc(r,flat(o)).catch(e=>{throw code(e)}),
      delete:()=>F.deleteDoc(r).catch(e=>{throw code(e)})}}})};
}
/* ---------- install ---------- */
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;showInstall()});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone;
function showInstall(){const b=document.getElementById("install");if(!b||standalone())return;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  let dismissed=false;try{dismissed=localStorage.getItem("mg-install-x")==="1"}catch{}
  if(installEvt){b.hidden=false;b.querySelector("span").textContent="התקן את המגרש כאפליקציה בטלפון";b.querySelector(".go").hidden=false}
  else if(ios&&!dismissed){b.hidden=false;b.querySelector("span").textContent="להתקנה: לחץ על כפתור השיתוף ⬆︎ ואז \"הוספה למסך הבית\"";b.querySelector(".go").hidden=true}}
document.addEventListener("click",async e=>{
  if(e.target.closest("#install .go")&&installEvt){installEvt.prompt();await installEvt.userChoice;installEvt=null;document.getElementById("install").hidden=true}
  if(e.target.closest("#install .x")){document.getElementById("install").hidden=true;try{localStorage.setItem("mg-install-x","1")}catch{}}});
showInstall();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
/* ---------- boot ---------- */
render();
(async()=>{
  let db=null;
  try{db=await connectFirebase()}catch(e){console.warn("firebase",e);db=null}
  if(db){S.mode="db";B=dbBackend(db)}else{S.mode="local";B=localBackend();if(window.FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId)toast("אין חיבור לשרת — עובד במצב מקומי")}
  B.start();render();
})();
})();
